# =====================================================================
# Konfigurasi Mosquitto MQTT broker
# Autentikasi WAJIB diaktifkan (bukan anonymous) untuk keamanan jaringan.
# File password_file dibuat lewat perintah di bawah, JANGAN commit file
# password mentah ke git.
# =====================================================================

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/password_file

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice

# =====================================================================
# CARA MEMBUAT password_file (jalankan di host, sebelum compose up):
#
#   docker run --rm -it -v $(pwd)/mosquitto/config:/mosquitto/config \
#     eclipse-mosquitto:2 \
#     mosquitto_passwd -c /mosquitto/config/password_file kp_mqtt_user
#
# Perintah di atas akan meminta password interaktif — gunakan nilai yang
# sama dengan MQTT_PASSWORD di file .env, lalu isi juga di firmware
# gateway_esp32/include/config.h (MQTT_USERNAME/MQTT_PASSWORD).
# =====================================================================
